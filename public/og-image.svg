<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2228"/>
      <stop offset="100%" style="stop-color:#0f171c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1f6f4c"/>
      <stop offset="100%" style="stop-color:#2a9d6a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="200" y1="0" x2="1200" y2="530" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="1200" y2="430" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1000" y2="630" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Green accent bar at top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Green glow circle -->
  <circle cx="900" cy="300" r="200" fill="#1f6f4c" opacity="0.08"/>
  <circle cx="900" cy="300" r="120" fill="#1f6f4c" opacity="0.06"/>

  <!-- Logo area -->
  <text x="80" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#1f6f4c" letter-spacing="-0.5">
    Inzira
  </text>

  <!-- Tagline under logo -->
  <text x="80" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#68726d" font-weight="500">
    A guided path for Rwandan youth
  </text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">
    The help was always there.
  </text>
  <text x="80" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="#2a9d6a" letter-spacing="-1">
    Now it has a direction.
  </text>

  <!-- Description -->
  <text x="80" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#9aa29d" font-weight="400">
    Connecting Rwandan youth with verified employment support programs.
  </text>

  <!-- Stats row -->
  <g transform="translate(80, 420)">
    <!-- Stat 1 -->
    <text font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#2a9d6a">60%+</text>
    <text y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#68726d">youth unemployment</text>

    <!-- Stat 2 -->
    <g transform="translate(200, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#2a9d6a">3</text>
      <text y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#68726d">institutions to navigate</text>
    </g>

    <!-- Stat 3 -->
    <g transform="translate(400, 0)">
      <text font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#2a9d6a">1</text>
      <text y="22" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#68726d">guided path</text>
    </g>
  </g>

  <!-- URL -->
  <text x="80" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#545d65" font-weight="600">
    inzira.rw
  </text>

  <!-- Bottom accent line -->
  <rect x="80" y="590" width="60" height="3" rx="1.5" fill="url(#accent)"/>
</svg>
